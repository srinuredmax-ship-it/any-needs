# The database any-needs-db already exists in My Workspace.
# Configure SMS and payment secrets in the service settings before customer launch.
services:
- type: web
  name: any-needs
  runtime: docker
  plan: free
  healthCheckPath: /api/health
  envVars:
  - key: PORT
    value: 3000
  - key: NODE_ENV
    value: production
  - key: DATABASE_URL
    fromDatabase:
      name: any-needs-db
      property: connectionString
  - key: JWT_SECRET
    generateValue: true
  - key: OTP_SECRET
    generateValue: true
  - key: RAZORPAY_WEBHOOK_SECRET
    generateValue: true
  - key: WEB_ORIGIN
    value: https://any-needs.onrender.com
  - key: ADMIN_BOOTSTRAP_EMAIL
    value: admin@anyneeds.in
  - key: ADMIN_BOOTSTRAP_PASSWORD
    generateValue: true
  - key: OTP_PROVIDER
    value: twilio
  region: singapore
  repo: https://github.com/srinuredmax-ship-it/any-needs
  branch: feature/browser-only-hosting
