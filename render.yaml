services:
  - type: web
    name: any-needs
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: any-needs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: OTP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
databases:
  - name: any-needs-db
    plan: basic-256mb
    databaseName: anyneeds
    user: anyneeds
    ipAllowList: []
